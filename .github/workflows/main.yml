name: Build 60x Cursor EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath .
      
      - name: Install dependencies
        run: python -m pip install -r 60x_Cursor_Project/requirements.txt

      - name: Build EXE
        run: |
          cd 60x_Cursor_Project
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "60x Cursor" --collect-all PIL 60x_cursor.pyw

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 60x-Cursor
          path: 60x_Cursor_Project/dist/60x Cursor.exe
